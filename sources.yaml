# Only the five verified endpoints in ../sources.md. Delays are seconds.
user_agent: "SovereigntyMonitor/0.1 (Python research prototype; RSS/API collector)"
timeout_seconds: 30
sources:
  - id: eurlex
    url: https://eur-lex.europa.eu/EN/display-feed.rss?rssId=222
    parser: eurlex
    crawl_delay: 10
  - id: edpb
    url: https://www.edpb.europa.eu/feed/news_en
    parser: edpb
    crawl_delay: 0
  - id: uk_legislation
    url: https://www.legislation.gov.uk/new/data.feed
    parser: uk_legislation
    crawl_delay: 5
  - id: federal_register
    url: https://www.federalregister.gov/api/v1/documents.json?per_page=1
    parser: federal_register
    crawl_delay: 0
  - id: ftc
    url: https://www.ftc.gov/feeds/press-release-consumer-protection.xml
    parser: ftc
    crawl_delay: 5
