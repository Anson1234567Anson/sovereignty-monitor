name: scheduled-fetch
on:
  schedule:
    - cron: "0 0 * * *"   # 每日 00:00 UTC，即香港時間 08:00
  workflow_dispatch:
concurrency:
  group: scheduled-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check DATABASE_URL secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::未設定 repo secret DATABASE_URL。請到 Settings > Secrets and variables > Actions 加入 Supabase Session pooler 連接字串。"
            exit 1
          fi
          echo "DATABASE_URL 已設定（內容唔會印出）。"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Apply migrations
        run: python migrate.py
      - name: Fetch sources
        run: python fetch.py
